name: Release

on:
  push:
    tags: ['v*']

# Only the publishing job may write; everything before it reads.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Linux amd64 is the only supported platform. Each archive holds the app,
# stamped with the tag as its version. A tag is released only from a commit
# on main that passes the same checks as CI, and only with its notes file.
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Require a commit on main and release notes
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main ||
            { echo "::error::$GITHUB_REF_NAME is not on main"; exit 1; }
          test -f ".github/release-notes/$GITHUB_REF_NAME.md" ||
            { echo "::error::Missing .github/release-notes/$GITHUB_REF_NAME.md"; exit 1; }

  checks:
    needs: gate
    uses: ./.github/workflows/ci.yml

  release:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build and package
        run: scripts/package.sh "$GITHUB_REF_NAME"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          notes="$PWD/.github/release-notes/$GITHUB_REF_NAME.md"
          cd dist
          sha256sum labradorite_* > SHA256SUMS
          # A published release is never replaced: its archives and checksums
          # stay as they were first downloaded.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::error::$GITHUB_REF_NAME is already published; release a new version instead"
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file "$notes" labradorite_* SHA256SUMS
