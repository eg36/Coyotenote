name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Linux amd64 is the only supported platform. Each archive holds both apps,
# stamped with the tag as their version.
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: '0'
      GOOS: linux
      GOARCH: amd64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build and package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p package dist
          ldflags="-s -w -X github.com/eg36/coyotenote/internal/version.Version=$GITHUB_REF_NAME"
          go build -trimpath -ldflags "$ldflags" -o package/coyotenote ./cmd/coyotenote
          go build -trimpath -ldflags "$ldflags" -o package/coyotenote-web ./cmd/coyotenote-web
          test "$(package/coyotenote -version)" = "coyotenote $GITHUB_REF_NAME"
          test "$(package/coyotenote-web -version)" = "coyotenote-web $GITHUB_REF_NAME"
          mkdir -p package/docs
          cp README.md LICENSE THIRD_PARTY_NOTICES.md package/
          cp -r docs/WEB.md docs/licenses package/docs/
          tar -czf "dist/coyotenote_${GITHUB_REF_NAME}_${GOOS}_${GOARCH}.tar.gz" -C package .
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          notes="$PWD/.github/release-notes/$GITHUB_REF_NAME.md"
          cd dist
          sha256sum coyotenote_* > SHA256SUMS
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" coyotenote_* SHA256SUMS --clobber
          elif [ -f "$notes" ]; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file "$notes" coyotenote_* SHA256SUMS
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes coyotenote_* SHA256SUMS
          fi
