name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Linux amd64 is the only supported platform. Each archive holds the app,
# stamped with the tag as its version. A tag is released only from a commit
# on main that passes the same checks as CI, and only with its notes file.
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Require a commit on main and release notes
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main ||
            { echo "::error::$GITHUB_REF_NAME is not on main"; exit 1; }
          test -f ".github/release-notes/$GITHUB_REF_NAME.md" ||
            { echo "::error::Missing .github/release-notes/$GITHUB_REF_NAME.md"; exit 1; }

  checks:
    needs: gate
    uses: ./.github/workflows/ci.yml

  release:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build and package
        run: scripts/package.sh "$GITHUB_REF_NAME"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          notes="$PWD/.github/release-notes/$GITHUB_REF_NAME.md"
          cd dist
          sha256sum labradorite_* > SHA256SUMS
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" labradorite_* SHA256SUMS --clobber
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file "$notes" labradorite_* SHA256SUMS
          fi
