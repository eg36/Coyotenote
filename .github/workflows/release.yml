name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Linux amd64 is the only supported platform.
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: '0'
      GOOS: linux
      GOARCH: amd64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build and package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p package dist
          go build -trimpath -ldflags "-s -w -X main.version=$GITHUB_REF_NAME" -o package/coyotenote .
          cp README.md LICENSE THIRD_PARTY_NOTICES.md package/
          tar -czf "dist/coyotenote_${GITHUB_REF_NAME}_${GOOS}_${GOARCH}.tar.gz" -C package .
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum coyotenote_* > SHA256SUMS
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" coyotenote_* SHA256SUMS --clobber
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes coyotenote_* SHA256SUMS
          fi
