name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, windows]
        goarch: [amd64, arm64]
    env:
      CGO_ENABLED: '0'
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build and package
        shell: bash
        run: |
          set -euo pipefail
          binary=coyotenote
          if [ "$GOOS" = windows ]; then binary+=.exe; fi
          mkdir -p package dist
          go build -trimpath -ldflags "-s -w -X main.version=$GITHUB_REF_NAME" -o "package/$binary" .
          cp README.md package/
          if [ -f LICENSE ]; then cp LICENSE package/; fi
          archive="coyotenote_${GITHUB_REF_NAME}_${GOOS}_${GOARCH}"
          if [ "$GOOS" = windows ]; then
            (cd package && zip -q "../dist/$archive.zip" ./*)
          else
            tar -czf "dist/$archive.tar.gz" -C package .
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: coyotenote-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: coyotenote-*
          merge-multiple: true
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum coyotenote_* > SHA256SUMS
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" coyotenote_* SHA256SUMS --clobber
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes coyotenote_* SHA256SUMS
          fi
