name: Release

on:
  push:
    # Test versions belong in Actions artifacts, never public Releases.
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

# Only the publishing job may write; everything before it reads.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Only exact stable tags publish, from main after CI and native package checks.
# Use the same two tested Linux archives as the manual artifact-only workflow.
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Require a commit on main and release notes
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Only stable vMAJOR.MINOR.PATCH tags may publish a release"
            exit 1
          fi
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main ||
            { echo "::error::$GITHUB_REF_NAME is not on main"; exit 1; }
          test -f ".github/release-notes/$GITHUB_REF_NAME.md" ||
            { echo "::error::Missing .github/release-notes/$GITHUB_REF_NAME.md"; exit 1; }

  checks:
    needs: gate
    uses: ./.github/workflows/ci.yml

  packages:
    needs: checks
    uses: ./.github/workflows/packages.yml
    with:
      version: ${{ github.ref_name }}

  release:
    needs: packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: labradorite_*
          path: tested-packages
      - name: Collect the two tested Linux archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir dist
          test "$(find tested-packages -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 2
          for target in linux_amd64 linux_arm64; do
            package="tested-packages/labradorite_${GITHUB_REF_NAME}_${target}"
            (cd "$package" && sha256sum --check SHA256SUMS)
            cp "$package/labradorite_${GITHUB_REF_NAME}_${target}.tar.gz" dist/
          done
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          notes="$PWD/.github/release-notes/$GITHUB_REF_NAME.md"
          cd dist
          sha256sum labradorite_* > SHA256SUMS
          # A published release is never replaced: its archives and checksums
          # stay as they were first downloaded.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::error::$GITHUB_REF_NAME is already published; release a new version instead"
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" --verify-tag --latest --title "$GITHUB_REF_NAME" --notes-file "$notes" labradorite_* SHA256SUMS
