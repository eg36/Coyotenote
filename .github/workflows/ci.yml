name: CI

# Retain main's Linux checks and docs-only exclusions; add web_alpha and
# browser checks. Tags do not trigger this CI; this alpha has no release workflow.
on:
  push:
    branches: [main, web_alpha]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'logo.png'
      - '.github/workflows/release.yml'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'logo.png'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch cancels the run it supersedes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - run: go build -o bin/coyotenote .
      - run: python3 scripts/smoke.py

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify committed browser assets are current
        run: git diff --exit-code -- web/assets
      - run: go build -o bin/coyotenote .
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 7
