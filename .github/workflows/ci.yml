name: CI

# Tags are already tested on main and are built by the Release workflow.
# Changes touching only docs, the logo or the license skip CI.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'logo.png'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'logo.png'
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch cancels the run it supersedes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - run: go build -o bin/coyotenote .
      - run: python3 scripts/smoke.py
