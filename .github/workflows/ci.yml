name: CI

# The Release workflow calls this workflow for each tag before packaging.
# Changes touching only docs, the logos or the license skip CI.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'logo.png'
      - 'web/logo.png'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'logo.png'
      - 'web/logo.png'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# A newer push to the same branch cancels the run it supersedes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - run: go build -o bin/labradorite ./cmd/labradorite
      - run: python3 scripts/smoke_web.py
      - name: Package a release archive (dry run)
        run: scripts/package.sh v0.0.0-ci

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify committed browser assets are current
        run: git diff --exit-code -- web/assets
      - run: go build -o bin/labradorite ./cmd/labradorite
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 7
