name: Native packages

on:
  workflow_call:
    inputs:
      version:
        description: Version stamped into both Linux binaries (no tag is created)
        required: true
        type: string

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux/amd64
            runner: ubuntu-24.04
            artifact: linux_amd64
            executable: labradorite
            browser: true
          - target: linux/arm64
            runner: ubuntu-24.04-arm
            artifact: linux_arm64
            executable: labradorite
            browser: false
    defaults:
      run:
        shell: bash
    env:
      BUILD_VERSION: ${{ inputs.version }}
      BUILD_TARGET: ${{ matrix.target }}
      LABRADORITE_BINARY: ./bin/${{ matrix.executable }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Native platform and vault checks
        run: |
          go vet ./...
          go test -count=1 -v ./...
      - name: Native race checks
        run: go test -race -count=1 ./...
      - name: Packaging input checks
        run: python -m unittest discover -s scripts -p "*_test.py"
      - name: Package the requested native target
        run: python scripts/package.py "$BUILD_VERSION" --target "$BUILD_TARGET"
      - name: Verify archive and extract the exact packaged executable
        run: python scripts/verify_package.py dist "$BUILD_VERSION" "$BUILD_TARGET" --extract bin
      - name: Packaged HTTP, persistence and shutdown smoke
        run: python scripts/smoke_web.py
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: matrix.browser
        with:
          node-version: 24
          cache: npm
      - name: Install browser regression tools
        if: matrix.browser
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Browser regression against the packaged binary
        if: matrix.browser
        run: npm test
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure() && matrix.browser
        with:
          name: browser-results-${{ matrix.artifact }}
          path: test-results/
          retention-days: 7
      - name: Record verification and remaining manual checks
        env:
          BROWSER_TESTED: ${{ matrix.browser }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          browser = os.environ['BROWSER_TESTED'] == 'true'
          text = f'''Version: {os.environ['BUILD_VERSION']}
          Commit: {os.environ['GITHUB_SHA']}
          Target: {os.environ['BUILD_TARGET']}
          Passed: native Go vet/tests (paths, locking, atomic replacement, trash/restore, history, conflicts, browser-launch command), archive contents, architecture, version, SHA256, HTTP, durable save/restart and shutdown.
          Browser regression: {'full Chromium suite passed (including drafts)' if browser else 'not run on ARM; desktop/browser and draft recovery need manual validation'}.
          Race detector: passed.
          Manual desktop check pending: default browser association and visual behavior on the target Linux desktop. No installer or code signing is provided.
          '''
          Path('dist/VALIDATION.txt').write_text(text, encoding='utf-8')
          PY
      - name: Upload tested package (90 days)
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: labradorite_${{ inputs.version }}_${{ matrix.artifact }}
          path: dist/
          if-no-files-found: error
          retention-days: 90
      - name: Download and validation summary
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          text = Path('dist/VALIDATION.txt').read_text()
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write(f"### {os.environ['BUILD_TARGET']} — {os.environ['BUILD_VERSION']}\n\n")
              summary.write(f"[Download this target]({os.environ['ARTIFACT_URL']}) (sign in with repository read access; retained 90 days).\n\n")
              summary.write('Extract the Actions download, verify the inner tar.gz archive with SHA256SUMS, then extract that archive. See the included guide for running Labradorite.\n\n```text\n' + text + '```\n')
          PY
